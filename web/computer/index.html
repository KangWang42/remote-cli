<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fbfbfc">
  <title>电脑设置 · Remote CLI</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../app.css">
  <link rel="stylesheet" href="computer.css">
  <script defer src="../terminal/skins.js"></script>
  <script defer src="computer.js"></script>
</head>
<body>
  <main id="page">
    <header class="top">
      <button type="button" class="icon" id="back" aria-label="返回"></button>
      <div class="who">
        <h1>电脑设置</h1>
        <p id="device" role="status" aria-live="polite"><span id="device-text">正在询问电脑…</span></p>
      </div>
    </header>

    <div id="loading" aria-hidden="true"><i></i><i></i><i></i></div>
    <section id="state" class="notice" role="status" aria-live="polite" hidden><b id="state-title"></b><span id="state-text"></span></section>

    <div id="body" hidden>
      <section>
        <div class="section-head"><h2>连接线路</h2><p>手机通过哪条线路连到这台电脑</p></div>
        <ul class="cards" id="lines"></ul>
      </section>
      <section>
        <div class="section-head"><h2>设置</h2><p>只影响这台电脑</p></div>
        <ul class="cards" id="settings"></ul>
      </section>
      <p class="note">添加中转、修改密码和本机端口需在电脑上操作。</p>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="sheet"><form method="dialog" id="sheet-form"></form></dialog>
</body>
</html>
